  - name: students
    id: { column: Student_ID, prefix: "ST-" }
    created: Enrolled_At
    status: { column: Status, values: [Active, At Risk, Critical, Inactive] }
    title: Name
    subtitle: [Course, Batch]
    owner: Mentor
    contact: { phone: Parent_Phone, whatsapp: Parent_Phone }
    columns: [Student_ID, Enrolled_At, Name, Student_Phone, Parent_Name, Parent_Phone, Course, Batch, Address, Status, Attendance_Pct, Last_Score, Avg_Score, Class_Rank, Strong_Subjects, Weak_Subjects, Performance_Trend, Fee_Status, Fee_Amount_INR, Fee_Due_Date, Mentor, Counsellor, Issue_Type, Main_Issue, Last_Counselled_At, Last_Report_At, Last_Parent_Call_At, Parent_Sentiment, Parent_Concern]
