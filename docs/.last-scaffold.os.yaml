      Last_Score: { type: number, min: 0, max: 100 }
      Avg_Score: { type: number, min: 0, max: 100 }
      Class_Rank: { type: number, min: 1, integer: true }
      Performance_Trend: { one_of: [Improving, Stable, Declining] }
      Fee_Status: { one_of: [Paid, Partial, Due, Overdue] }
      Fee_Amount_INR: { type: number, positive: true }
      Issue_Type: { one_of: [ACADEMIC, PERSONAL, ATTENDANCE, FINANCIAL, OTHER] }
      Parent_Sentiment: { one_of: [Happy, Neutral, Concerned, No Answer] }
      Student_Phone: { type: phone }
      Parent_Phone: { type: phone }
