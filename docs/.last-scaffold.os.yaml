# os.yaml — Pucho EduFlow OS (product) · pucho-os v5.1.1 · step 2 draft, 2 Nov 2026
# Sources: coaching_crm.html (mockup) + 5._Parent_Communication_Agent.json (n8n) → intake/00-product-brief.md (R1–R40).
# Call policy: the RECOMMENDED policy (intake/01-step1-summary.md) — WhatsApp on every absence, a call from the 2nd absence in a
# week; Friday WhatsApp report to every parent, a call only to parents of at-risk students; fee calls on day 1, 7 and 15 overdue.
# ⚑ = assumption to confirm (gaps G1–G10). Demo business (invented, G8): Replora Coaching Institute, Bhopal.
os:
  name: EduFlow
  slug: eduflow-os
  mode: product
  client: Pucho EduFlow OS
  one_liner: Every lead, absence, overdue fee, slipping student and parent gets an AI call or a WhatsApp on time, and the director sees what needs action on one screen.
  tagline: Admissions, attendance, fees and parent updates — called and messaged on time, without the office dialling.
  languages: [en, hi]
  volume_per_month: 4200          # ⚑ typical buyer (342 students): calls + WhatsApp + dispatcher runs, intake/estimate/typical-recommended
  success_metric: Fees overdue going down month on month, and every absence with a reason collected
  plan: growth
  seed_dates: today
  brand: { color: "#4F46E5", name: EduFlow }
  audit: true
  limits: { actions_per_day: 1500, public_actions_per_hour: 60 }   # bulk Friday reports to every parent go through the app

requirements:
  - { id: R1, text: "The office admin adds a lead with name, phone, email, course interest and source" }
  - { id: R2, text: "A new lead gets an AI qualification call as soon as the lead is saved" }
  - { id: R3, text: "A lead is graded HOT, WARM or COLD with a score and a qualification summary from the call" }
  - { id: R4, text: "A counsellor is alerted on WhatsApp when a lead is graded HOT" }
  - { id: R5, text: "A counsellor reads the call transcript and the next action on the lead" }
  - { id: R6, text: "The director assigns a lead to a counsellor" }
  - { id: R7, text: "A counsellor starts a fresh AI call to a lead with one click" }
  - { id: R8, text: "A counsellor moves a COLD lead to nurture" }
  - { id: R9, text: "The director sees HOT leads that no counsellor has followed up within 48 hours" }
  - { id: R10, text: "The office admin enrols a student with parent name and phone, course, batch, fee amount and fee due date" }
  - { id: R11, text: "A parent of a newly enrolled student gets a welcome message on WhatsApp" }
  - { id: R12, text: "The office admin filters students by course, batch and status" }
  - { id: R13, text: "The director opens a student profile with attendance, last test, rank, strong and weak subjects and parent info" }
  - { id: R14, text: "The office admin marks each student of a batch present or absent for a date" }
  - { id: R15, text: "A parent gets an AI call asking the reason when the student is marked absent" }
  - { id: R16, text: "The office admin sees the reason and category collected by the call against each absence" }
  - { id: R17, text: "A counsellor is alerted on WhatsApp when an absence needs follow-up" }
  - { id: R18, text: "The director sees students below 75% attendance as critical" }
  - { id: R19, text: "The office admin records each student's test score per subject" }
  - { id: R20, text: "A student below 75% attendance or 60% score joins the at-risk queue every Monday at 11 AM" }
  - { id: R21, text: "An at-risk student gets an AI counselling call that records the issue type and main issue" }
  - { id: R22, text: "A mentor is alerted on WhatsApp when the call says the student needs a mentor" }
  - { id: R23, text: "The director assigns a mentor or counsellor to an at-risk student" }
  - { id: R24, text: "A parent with an overdue fee gets a reminder call and a WhatsApp payment link on the 10 AM run" }
  - { id: R25, text: "The office admin sends one parent a payment link with one click" }
  - { id: R26, text: "The office admin records a fee payment received" }
  - { id: R27, text: "A parent gets a reminder 3 days before a fee falls due" }
  - { id: R28, text: "The director sees fees collected this month, total overdue and the overdue students" }
  - { id: R29, text: "A parent gets a weekly performance update call on Friday at 5 PM" }
  - { id: R30, text: "A parent gets the weekly performance summary on WhatsApp with attendance, score and trend" }
  - { id: R31, text: "The director gets a management alert when a parent raises a concern on the call" }
  - { id: R32, text: "The director sees parent sentiment counts: happy, neutral and concerned" }
  - { id: R33, text: "A parent who did not answer gets a retry call" }
  - { id: R34, text: "The office admin sends a WhatsApp template to one parent, a batch or all parents" }
  - { id: R35, text: "The director sees every AI call from all agents in one log, with outcome and transcript" }
  - { id: R36, text: "The director sees every WhatsApp message with its delivery status" }
  - { id: R37, text: "The director sees action-required alerts with severity and marks them read" }
  - { id: R38, text: "The director searches students, leads, phones and courses from anywhere" }
  - { id: R39, text: "The director exports a list to CSV" }
  - { id: R40, text: "The director sees the institute dashboard: students, new leads this week, fees overdue, average attendance" }
  - { id: R41, text: "The office admin adds the institute's own courses and batches, and the enrolment form offers them" }

not_in_v1:
  - { text: "A parent or student login portal — parents are reached by call and WhatsApp only (X1)", covers: [] }
  - { text: "An online test engine — scores are entered on the Test scores page (X2)", covers: [] }
  - { text: "Timetable, faculty attendance and payroll (X3)", covers: [] }
  - { text: "Handling inbound WhatsApp replies with AI (X4)", covers: [] }
  - { text: "Multi-branch institutes in one deployment (X5)", covers: [] }
  - { text: "The n8n AI Agents Status page — replaced by Settings → Flow webhook URLs and /api/health (X6)", covers: [] }

roles:
  - { key: admin,      label: Director,     color: bg-primary-500, desc: "Runs the institute: what needs action, leads, students, fees, parents and every AI call", pages: ["*"], demo: { email: director@eduflow.pucho.ai, password: director123, name: Dev Dabi } }
  - { key: office,     label: Office admin, color: bg-stage-4,     desc: "Marks attendance, enrols students, records fees and sends WhatsApp templates", pages: [attendance, students, scores, fees, messages, alerts, courses, batches, settings], home: /attendance, demo: { email: office@eduflow.pucho.ai, password: office1234, name: Sunita Rao } }
  - { key: counsellor, label: Counsellor,   color: bg-stage-3,     desc: "Works the leads the AI qualified, follows up absences and parent concerns", pages: [leads, calls, students, parents, alerts, messages, settings], home: /leads, demo: { email: counsellor@eduflow.pucho.ai, password: counsel123, name: Priya Saxena } }
  - { key: mentor,     label: Mentor,       color: bg-stage-2,     desc: "Looks after at-risk students: counselling calls, scores and mentor sessions", pages: [academic, scores, students, attendance, calls, settings], home: /academic, demo: { email: mentor@eduflow.pucho.ai, password: mentor1234, name: Arvind Mishra } }

journeys:
  - { role: admin,      does: "Clear today's escalations",                 lands: overview,   steps: ["Overview opens on Needs action", "Open alerts row → Acknowledge"] }
  - { role: admin,      does: "Give a HOT lead to a counsellor",           lands: overview,   steps: ["HOT leads past 48 h on Needs action", "Assign → pick the counsellor"] }
  - { role: office,     does: "Mark today's attendance for a batch",       lands: attendance, steps: ["Attendance opens with the batch sheet", "Tap P or A per student", "Save — absent parents get WhatsApp / a call"] }
  - { role: office,     does: "Record a fee payment",                       lands: fees,       steps: ["Fees, Overdue tab", "Record payment on the row", "Amount + mode → Save"] }
  - { role: counsellor, does: "Follow up a HOT lead the AI qualified",     lands: leads,      steps: ["Leads, HOT chip", "Open the lead — summary and transcript", "Enrol, or Call again"] }
  - { role: mentor,     does: "Counsel an at-risk student",                lands: academic,   steps: ["Academic opens on the at-risk tab", "Start AI call, or Assign mentor on the row"] }

metrics:
  students_active: { entity: students, label: Active students,      where: "Status!=Inactive", icon: GraduationCap }
  at_risk:         { entity: students, label: At risk,              where: "Status in [At Risk, Critical]", tone: warn, icon: AlertTriangle }
  low_attendance:  { entity: students, label: Below 75% attendance, where: "Attendance_Pct<75 and Status!=Inactive", tone: bad, icon: CalendarX }
  new_leads_7d:    { entity: leads,    label: New leads this week,  where: "Created_At in last 7 days", icon: UserPlus }
  hot_leads:       { entity: leads,    label: HOT leads,            where: "Grade=HOT and Stage not in [Enrolled, Lost]", tone: info, icon: Flame }
  hot_overdue:     { entity: leads,    label: HOT leads past 48 h,  where: "Grade=HOT and Next_Followup_At<today and Stage not in [Enrolled, Lost]", tone: bad, icon: Flame }
  fees_overdue:    { entity: fees,     label: Fees overdue,         where: "Status=Overdue", sum: Balance_INR, format: money_l, tone: bad, icon: IndianRupee }
  overdue_count:   { entity: fees,     label: Overdue students,     where: "Status=Overdue", tone: bad, icon: UserX }
  overdue_15:      { entity: fees,     label: Overdue 15+ days,     where: "Status=Overdue and Days_Overdue>=15", tone: bad, icon: AlertOctagon }
  collected_month: { entity: fees,     label: Collected this month, where: "Paid_At in month", sum: Paid_INR, format: money_l, tone: ok, icon: Wallet }
  alerts_open:     { entity: alerts,   label: Open alerts,          where: "Status=Open", tone: bad, icon: BellRing }
  absent_today:    { entity: attendance, label: Absent today,       where: "Date=today and Status=Absent", tone: warn, icon: UserMinus }
  present_today:   { entity: attendance, label: Present today,      where: "Date=today and Status=Present", tone: ok, icon: UserCheck }
  followup_needed: { entity: attendance, label: Needs follow-up,    where: "Needs_Followup=Yes and Date>=today-7", tone: bad, icon: PhoneForwarded }
  calls_week:      { entity: calls,    label: AI calls this week,   where: "Called_At in last 7 days", icon: PhoneCall }
  parents_happy:   { entity: calls,    label: Happy parents,        where: "Agent=Parent and Sentiment=Happy and Called_At in last 7 days", tone: ok, icon: Smile }
  parents_neutral: { entity: calls,    label: Neutral,              where: "Agent=Parent and Sentiment=Neutral and Called_At in last 7 days", tone: warn, icon: Meh }
  parents_concerned: { entity: calls,  label: Concerned parents,    where: "Agent=Parent and Sentiment=Concerned and Called_At in last 7 days", tone: bad, icon: Frown }
  messages_today:  { entity: messages, label: WhatsApp sent today,  where: "Sent_At=today", icon: MessageCircle }
  messages_failed: { entity: messages, label: Failed,               where: "Status=Failed", tone: bad, icon: MessageSquareX }

