  - name: calls
    id: { column: Call_ID, prefix: "CL-" }
    created: Called_At
    status: { column: Status, values: [Queued, Calling, Completed, No Answer, Failed, Escalated] }
    title: Person
    subtitle: [Agent, Course]
    contact: { phone: Phone, whatsapp: Phone }
    columns: [Call_ID, Called_At, Agent, Person, Relation, Phone, Lead_ID, Student_ID, Course, Status, Duration_Sec, Request_ID, Outcome, Summary, Transcript, Grade, Score, Sentiment, Concern, Issue_Type, Reason, Category, Needs_Followup, Retry_At]
    fields:
      Agent: { one_of: [Admission, Fee, Attendance, Academic, Parent] }
      Relation: { one_of: [Lead, Parent, Student] }
      Duration_Sec: { type: number, min: 0, integer: true }
      Grade: { one_of: [HOT, WARM, COLD] }
      Score: { type: number, min: 0, max: 100 }
      Sentiment: { one_of: [Happy, Neutral, Concerned, No Answer] }
      Issue_Type: { one_of: [ACADEMIC, PERSONAL, ATTENDANCE, FINANCIAL, OTHER] }
      Category: { one_of: [SICK, FAMILY, TRAVEL, PERSONAL, OTHER] }
      Needs_Followup: { one_of: ["Yes", "No"] }
      Phone: { type: phone }
