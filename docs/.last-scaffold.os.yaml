# ── Flows ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
# The five AI-call agents (ADMISSION_CALL, FEE_REMINDER.remind, ABSENCE.absent / reason_call, ACADEMIC_CALL, PARENT_UPDATE.update_call)
# each need: voiceCall → delay → getCallDetails → ONE Pucho CDM read → code → router → WhatsApp → write → Return. That is more than one
# tool step per path, so at step 6 they are built on the CUSTOM path (method/ai-pipeline.md: tools/build_eduflow_flows.py, stricter
# contracts) — the declarations below are what the app calls, simulates (effect:) and shows; prompts and describe: say what CDM reads.
# UNVERIFIED until a live Studio run: ai-voice-call voiceCall `connectionDetails` (G1), the longest `delay`, schedule fan-out.
flows:
  - name: ADMISSION_CALL
    covers: [R2, R3, R4, R5, R7]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { counsellors_from: team, voice_language: hi }
    writes: [leads, calls, messages]
    actions:
      - name: new_lead
        covers: [R1, R2, R3, R4]
        model: standard
        async: true
        payload: { Name: string, Phone: string, Email: string, Course: string, Source: string, Notes: string, Assigned_To: string }
        prompt: |
          You read the transcript of an AI admission call to a coaching-institute lead ({{payload.Name}}, interested in {{payload.Course}}; notes: {{payload.Notes}}).
          Grade the lead: HOT (ready to join or book a demo now), WARM (interested, comparing or needs a follow-up), COLD (not joining this year).
          Write a two-line qualification summary and the next action for the counsellor, in the language the lead used (Hinglish allowed).
          Reply ONLY with JSON: {"grade": "HOT|WARM|COLD", "score": 0, "summary": "", "next_action": ""}
        result: { grade: "HOT|WARM|COLD", score: number, summary: string, next_action: string }
        ai_task: extract
        ai_text: [Name, Course, Notes]
        describe: { grade: "how ready the lead is: HOT (joining or booking a demo now), WARM (interested, needs a follow-up), COLD (not joining this year)", score: "readiness from 0 to 100", summary: "two lines on what the lead said: goal, current preparation, concerns", next_action: "the one next step for the counsellor" }
        rules: ["Custom path: voiceCall with the lead's name, course and notes as call context → delay ~3 min → getCallDetails → CDM extract on the transcript", "Score is the model's readiness; HOT also needs score ≥ 80, else WARM (code)", "HOT → Next_Followup_At = now + 48 h and a WhatsApp template eduflow_hot_lead_alert to the assigned counsellor (team.Phone), else the counsellor with the fewest open HOT leads for the course", "Writes the lead (Stage Called, Grade, Score, AI_Summary, Next_Action, Transcript, Call_Status), one calls row (Agent Admission) and one messages row", "No answer → Call_Status No Answer, one retry after 2 hours"]
        typical_seconds: 240
        credits: 44
        runs_per_month: 120
        effect: { insert: leads, fill: { Stage: Called, Grade: WARM, Score: 62, Call_Status: Completed, AI_Summary: "Simulated call — interested, wants the fee plan and a demo class.", Next_Action: "Share the fee plan and book a demo", Last_Called_At: now } }
      - name: call
        covers: [R7]
        model: standard
        async: true
        payload: { Lead_ID: string, Name: string, Phone: string, Course: string, Notes: string }
        prompt: "same_as: ADMISSION_CALL.new_lead"
        result: "same_as: ADMISSION_CALL.new_lead"
        ai_task: extract
        ai_text: [Name, Course, Notes]
        describe: "same_as: ADMISSION_CALL.new_lead"
        rules: ["Same pipeline as new_lead on an existing lead; patches the lead instead of inserting"]
        typical_seconds: 240
        credits: 44
        runs_per_month: 30
        effect: { patch: leads, fill: { Call_Status: Completed, Last_Called_At: now, AI_Summary: "Simulated re-call — still interested; call back after the weekend." } }

  - name: STUDENT_MANAGE
    covers: [R10, R11]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    writes: [students, fees, messages]
    actions:
      - name: enrol
        model: none
        payload: { Name: string, Phone: string, Student_Phone: string, Parent_Name: string, Parent_Phone: string, Course: string, Batch: string, Fee_Amount_INR: number, Fee_Due_Date: string, Address: string, Counsellor: string }
        sends: { tool: whatsapp, to: Parent_Phone, template: { name: eduflow_welcome, variables: { "1": "{{Parent_Name}}", "2": "{{Name}}", "3": "{{Course}}", "4": "{{Batch}}" } } }
        rules: ["Inserts the student (Status Active) and the first fees row (Amount_INR = Fee_Amount_INR, Due_Date = Fee_Due_Date, Status Upcoming) in code", "Welcome template to the parent after the write; one messages row (Type Welcome)", "From a lead: the lead's Stage → Enrolled; the lead's Phone becomes Student_Phone"]
        typical_seconds: 5
        credits: 7
        runs_per_month: 30
        effect: { insert: students, fill: { Status: Active, Fee_Status: Due, Enrolled_At: now }, map: { Phone: Student_Phone } }

  - name: ATTENDANCE
    covers: [R14, R15]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    writes: [attendance_sessions, attendance]
    actions:
      - name: save_batch
        covers: [R14, R15]
        via: custom                 # called by the AttendanceSheet custom section
        model: none
        payload: { Date: string, Batch: string, Total_Count: number, Present_Count: number, Absent_Count: number, Absentees: string, Marked_By: string, lines: array }
        rules: ["One call per batch per date: the session row and every student's mark (its lines) are written in ONE transaction — a refused mark rolls the whole save back", "Present marks need nothing else: no workflow, no AI, no WhatsApp", "Then, for each Student_ID in Absentees only, the flow posts ABSENCE.absent (WhatsApp on a first absence in 7 days, the AI call on a repeat)", "Absences_This_Week and Absences_This_Month on each line are counted by the sheet from the stored marks (code)"]
        typical_seconds: 6
        credits: 6
        runs_per_month: 90
        effect: { insert: attendance_sessions, fill: { Saved_At: now }, lines: { entity: attendance, by: Session_ID } }

  - name: ABSENCE
    covers: [R14, R15, R16, R17]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { counsellors_from: team, call_from_absence: 2, voice_language: hi }
    writes: [attendance, calls, messages, alerts]
    actions:
      - name: absent
        covers: [R14, R15]
        via: custom
        model: standard
        async: true
        payload: { Date: string, Batch: string, Student_ID: string, Name: string, Course: string, Parent_Name: string, Parent_Phone: string, Absences_This_Week: number, Absences_This_Month: number, Marked_By: string }
        prompt: |
          You read the transcript of a call to the parent of {{payload.Name}} ({{payload.Course}}, {{payload.Batch}}), who was absent on {{payload.Date}}.
          Extract the reason in the parent's words, its category (SICK, FAMILY, TRAVEL, PERSONAL, OTHER) and whether a counsellor should follow up (repeated absence, distress, dropping out, a complaint).
          Reply ONLY with JSON: {"reason": "", "category": "SICK|FAMILY|TRAVEL|PERSONAL|OTHER", "needs_followup": "Yes|No"}
        result: { reason: string, category: "SICK|FAMILY|TRAVEL|PERSONAL|OTHER", needs_followup: "Yes|No" }
        ai_task: extract
        ai_text: [Name, Course, Batch, Date]
        describe: { reason: "why the student was absent, in the parent's words", category: "SICK, FAMILY, TRAVEL, PERSONAL or OTHER", needs_followup: "Yes when the absence is repeated, the student may drop out, or the parent complains; else No" }
        rules: ["Posted by ATTENDANCE.save_batch once per absentee — never for a present student", "Code first: Absences_This_Week < call_from_absence → WhatsApp template eduflow_absence_alert only (Call_Status WhatsApp Sent) and Return — no call, no AI", "Otherwise voiceCall the parent → delay ~4 min → getCallDetails → CDM extract → write Reason / Category / Needs_Followup / Call_Status", "Needs_Followup Yes → WhatsApp eduflow_staff_alert to the student's counsellor and an alerts row (Kind Attendance, HIGH)"]
        typical_seconds: 300
        credits: 14                 # blended: ~70 % of absences are WhatsApp-only (7) and ~30 % get the call (29) — recommended policy
        runs_per_month: 1144
        effect: { insert: attendance, fill: { Status: Absent, Call_Status: WhatsApp Sent, Needs_Followup: "No" } }
      - name: reason_call
        covers: [R15, R16, R17]
        model: standard
        async: true
        payload: { Att_ID: string, Date: string, Batch: string, Student_ID: string, Name: string, Course: string, Parent_Name: string, Parent_Phone: string }
        prompt: "same_as: ABSENCE.absent"
        result: "same_as: ABSENCE.absent"
        ai_task: extract
        ai_text: [Name, Course, Batch, Date]
        describe: "same_as: ABSENCE.absent"
        rules: ["A call on an absence already marked (row action) — same call → CDM → write → alert as absent"]
        typical_seconds: 300
        credits: 29
        runs_per_month: 60
        effect: { patch: attendance, fill: { Call_Status: Call Done, Reason: "Simulated call — unwell, will attend tomorrow", Category: SICK, Needs_Followup: "No" } }

  - name: ACADEMIC_CALL
    covers: [R20, R21, R22]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { mentors_from: team, voice_language: hi }
    writes: [students, calls, alerts, messages]
    actions:
      - name: counsel
        model: standard
        async: true
        payload: { Student_ID: string, Name: string, Student_Phone: string, Course: string, Attendance_Pct: number, Last_Score: number, Weak_Subjects: string, Mentor: string }
        prompt: |
          You read the transcript of an AI counselling call to {{payload.Name}} ({{payload.Course}}; attendance {{payload.Attendance_Pct}}%, last test {{payload.Last_Score}}%, weak in {{payload.Weak_Subjects}}).
          Extract the main issue in one line, its type, and whether the student needs a mentor session or a counsellor.
          Reply ONLY with JSON: {"issue_type": "ACADEMIC|PERSONAL|ATTENDANCE|FINANCIAL|OTHER", "main_issue": "", "needs_mentor": "Yes|No", "needs_counsellor": "Yes|No"}
        result: { issue_type: "ACADEMIC|PERSONAL|ATTENDANCE|FINANCIAL|OTHER", main_issue: string, needs_mentor: "Yes|No", needs_counsellor: "Yes|No" }
        ai_task: extract
        ai_text: [Name, Course, Weak_Subjects]
        describe: { issue_type: "the kind of problem: ACADEMIC, PERSONAL, ATTENDANCE, FINANCIAL or OTHER", main_issue: "the student's main problem in one line", needs_mentor: "Yes when the student needs a subject mentor session", needs_counsellor: "Yes when the student needs a counsellor (stress, family, motivation)" }
        rules: ["The Monday 11:00 ACADEMIC_RUN selects students with Attendance_Pct < 75 or Last_Score < 60 (max 50) and posts each here", "voiceCall the student → delay ~5 min → getCallDetails → CDM extract", "needs_mentor or needs_counsellor Yes → WhatsApp eduflow_staff_alert to the mentor / counsellor and an alerts row (Kind Academic)", "Writes Issue_Type, Main_Issue, Last_Counselled_At on the student and one calls row (Agent Academic)"]
        typical_seconds: 360
        credits: 54
        runs_per_month: 147
        effect: { patch: students, fill: { Issue_Type: ACADEMIC, Main_Issue: "Simulated call — struggling with the weak subjects; asked for extra doubt sessions", Last_Counselled_At: now } }

  - name: FEE_REMINDER
    covers: [R24, R25, R27]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { voice_language: hi }
    writes: [fees, calls, messages, alerts]
    actions:
      - name: remind
        covers: [R24]
        model: standard
        async: true
        payload: { Fee_ID: string, Student_Name: string, Parent_Name: string, Parent_Phone: string, Course: string, Balance_INR: number, Due_Date: string, Days_Overdue: number, Payment_Link: string }
        prompt: |
          You read the transcript of a polite fee-reminder call to {{payload.Parent_Name}}, parent of {{payload.Student_Name}} ({{payload.Course}}), about ₹{{payload.Balance_INR}} due on {{payload.Due_Date}}.
          Extract what the parent said and the date they promised to pay, if any.
          Reply ONLY with JSON: {"parent_response": "", "promise_date": ""}
        result: { parent_response: string, promise_date: string }
        ai_task: extract
        ai_text: [Parent_Name, Student_Name, Course, Due_Date]
        describe: { parent_response: "what the parent said about paying, in their words", promise_date: "the date the parent promised to pay, if they named one" }
        rules: ["The daily 10:00 FEE_RUN posts each fee on day 1, 7 and 15 of being overdue (recommended policy)", "voiceCall the parent → delay ~3 min → getCallDetails → CDM extract → WhatsApp template eduflow_fee_payment_link → write", "Reminder_Count + 1, Last_Reminder_At now, Promise_Date, Parent_Response (code)", "Day 15 or later with no promise → alerts row (Kind Fee, CRITICAL) for the director"]
        typical_seconds: 240
        credits: 29
        runs_per_month: 69
        effect: { patch: fees, fill: { Last_Reminder_At: now, Parent_Response: "Simulated call — will pay by Friday" } }
      - name: send_link
        covers: [R25, R27]
        model: none
        payload: { Fee_ID: string, Student_Name: string, Parent_Name: string, Parent_Phone: string, Balance_INR: number, Due_Date: string, Payment_Link: string }
        sends: { tool: whatsapp, to: Parent_Phone, template: { name: eduflow_fee_payment_link, variables: { "1": "{{Parent_Name}}", "2": "{{Student_Name}}", "3": "{{Balance_INR}}", "4": "{{Due_Date}}", "5": "{{Payment_Link}}" } } }
        rules: ["Also posted by FEE_RUN 3 days before Due_Date (R27) — WhatsApp only, no call", "Payment_Link from the fee row (⚑ G4: Razorpay per reminder or a fixed link)", "Last_Reminder_At now; one messages row (Type Payment Link)"]
        typical_seconds: 4
        credits: 7
        runs_per_month: 80
        effect: { patch: fees, fill: { Last_Reminder_At: now } }

  - name: PARENT_UPDATE
    covers: [R29, R30, R31, R33]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    constants: { voice_language: hi }
    writes: [students, calls, messages, alerts]
    actions:
      - name: weekly_report
        covers: [R30]
        model: none
        payload: { Student_ID: string, Name: string, Parent_Name: string, Parent_Phone: string, Attendance_Pct: number, Last_Score: number, Class_Rank: number, Performance_Trend: string }
        sends: { tool: whatsapp, to: Parent_Phone, template: { name: eduflow_weekly_report, variables: { "1": "{{Parent_Name}}", "2": "{{Name}}", "3": "{{Attendance_Pct}}", "4": "{{Last_Score}}", "5": "{{Class_Rank}}", "6": "{{Performance_Trend}}" } } }
        rules: ["Every Friday 17:00 PARENT_RUN posts every active student (recommended policy) — numbers from the record, never from a model", "Last_Report_At now; one messages row (Type Weekly Report)"]
        typical_seconds: 4
        credits: 7
        runs_per_month: 1481
        effect: { patch: students, fill: { Last_Report_At: now } }
      - name: update_call
        covers: [R29, R31, R33]
        model: standard
        async: true
        payload: { Student_ID: string, Name: string, Parent_Name: string, Parent_Phone: string, Course: string, Attendance_Pct: number, Last_Score: number, Class_Rank: number, Performance_Trend: string, Strong_Subjects: string, Weak_Subjects: string }
        prompt: |
          You read the transcript of a weekly update call to {{payload.Parent_Name}}, parent of {{payload.Name}} ({{payload.Course}}; attendance {{payload.Attendance_Pct}}%, last test {{payload.Last_Score}}%, rank {{payload.Class_Rank}}, trend {{payload.Performance_Trend}}).
          Extract the parent's sentiment, their feedback and any concern, and whether management should be alerted.
          Reply ONLY with JSON: {"sentiment": "Happy|Neutral|Concerned|No Answer", "feedback": "", "concern": "", "needs_escalation": "Yes|No"}
        result: { sentiment: "Happy|Neutral|Concerned|No Answer", feedback: string, concern: string, needs_escalation: "Yes|No" }
        ai_task: extract
        ai_text: [Parent_Name, Name, Course, Performance_Trend]
        describe: { sentiment: "how the parent felt: Happy, Neutral, Concerned, or No Answer when nobody spoke", feedback: "what the parent said, in one line", concern: "the parent's concern, if any", needs_escalation: "Yes when the parent is upset, threatens to withdraw or asks for the director" }
        rules: ["Friday 17:00 PARENT_RUN calls only parents of at-risk students (recommended policy); the row action calls any parent; a No Answer gets one retry on Monday 17:00 (R33)", "voiceCall → delay ~4 min → getCallDetails → CDM extract → write Parent_Sentiment, Parent_Concern, Last_Parent_Call_At and one calls row (Agent Parent)", "needs_escalation Yes → WhatsApp eduflow_staff_alert to the director and an alerts row (Kind Parent, HIGH)"]
        typical_seconds: 300
        credits: 49
        runs_per_month: 160
        effect: { patch: students, fill: { Parent_Sentiment: Happy, Last_Parent_Call_At: now } }

  - name: SEND_WHATSAPP
    covers: [R34]
    trigger: { tool: webhook, name: catch_webhook, auth: none }
    writes: [messages]
    actions:
      - name: send_update
        model: none
        payload: { Student_ID: string, Name: string, Parent_Name: string, Message: string, To: string }
        sends: { tool: whatsapp, to: { entity: students, match: Student_ID, by: Student_ID, column: Parent_Phone }, template: { name: eduflow_general_update, variables: { "1": "{{Parent_Name}}", "2": "{{Name}}", "3": "{{Message}}" } }, review: true }
        rules: ["One parent from the row, a batch or everyone through the Students page's bulk select — the modal runs once per row", "One messages row per send (Type General Update, Agent Office)"]
        typical_seconds: 4
        credits: 7
        runs_per_month: 57
        effect: { patch: students, fill: {} }

  # ── schedules (the dispatchers): the code selects the list, each record goes to its per-record flow ─────────────────────────
  - name: FEE_RUN
    covers: [R24, R27]
    trigger: { tool: schedule, name: cron_expression, input: { cronExpression: "0 10 * * *", timezone: Asia/Kolkata } }
    writes: [fees]
    actions:
      - { name: run, model: none, cadence: every_day, rules: ["Recompute Days_Overdue and Status (Due → Overdue the day after Due_Date) for every unpaid fee", "Overdue on day 1, 7 or 15 → POST FEE_REMINDER.remind; Due_Date = today + 3 → POST FEE_REMINDER.send_link"], typical_seconds: 20, credits: 5, runs_per_month: 30 }
  - name: ACADEMIC_RUN
    covers: [R20]
    trigger: { tool: schedule, name: cron_expression, input: { cronExpression: "0 11 * * 1", timezone: Asia/Kolkata } }
    writes: [students]
    actions:
      - { name: run, model: none, cadence: every_week, rules: ["Students with Attendance_Pct < 75 or Last_Score < 60 (max 50, worst first) → POST ACADEMIC_CALL.counsel"], typical_seconds: 20, credits: 5, runs_per_month: 4 }
  - name: PARENT_RUN
    covers: [R29, R30, R33]
    trigger: { tool: schedule, name: cron_expression, input: { cronExpression: "0 17 * * 1,5", timezone: Asia/Kolkata } }
    writes: [students]
    actions:
      - { name: run, model: none, cadence: every_week, rules: ["Friday: every active student → POST PARENT_UPDATE.weekly_report; Status At Risk / Critical → also POST PARENT_UPDATE.update_call", "Monday: last Friday's No Answer calls → POST PARENT_UPDATE.update_call once (R33)"], typical_seconds: 20, credits: 5, runs_per_month: 9 }
  - name: ROLLUP
    covers: [R9, R13, R18, R20, R28]
    trigger: { tool: schedule, name: cron_expression, input: { cronExpression: "30 1 * * *", timezone: Asia/Kolkata } }
    writes: [students, alerts]
    actions:
      - { name: run, model: none, cadence: every_day, rules: ["Per student, from attendance and tests: Attendance_Pct (last 30 days), Last_Score, Avg_Score, Class_Rank within course + batch, Performance_Trend (last 3 tests), Strong/Weak_Subjects", "Status: Critical when Attendance_Pct < 60 or Avg_Score < 40; At Risk when < 75 / < 60; else Active", "Fee_Status from the student's open fees rows", "Raises alerts (no duplicates while one is open): attendance < 75 (HIGH), fee overdue 15+ days (CRITICAL), HOT lead past 48 h (MEDIUM)"], typical_seconds: 25, credits: 5, runs_per_month: 30 }

# ── Pages ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────
pages:
  - id: overview
    covers: [R9, R28, R37, R40]
    kind: overview
    route: /
    label: Overview
    icon: LayoutDashboard
    desc: What needs action today, then the institute's numbers
    greeting: Here is what needs you today.
    roles: [admin]
    quick_links: false
    kpis:
      - { metric: students_active }
      - { metric: new_leads_7d }
      - { metric: fees_overdue, filter: false }
      - { label: Avg attendance, entity: students, formula: "avg Attendance_Pct where Status!=Inactive", format: pct, icon: CalendarCheck }
    queues:
      - { metric: alerts_open, action: acknowledge, action_label: Acknowledge, link: /alerts }
      - { metric: hot_overdue, action: assign, action_label: Assign, link: /leads }
      - { metric: overdue_15, action: send_link, action_label: Send link, link: /fees }
    charts:
      - { id: lead-funnel, type: funnel, entity: leads, title: Admissions funnel, where: "Stage!=Lost", span: 3, footer: "Leads by stage, with conversion from the previous stage. Lost leads are excluded." }
      - { id: calls-week, type: trend, entity: calls, title: AI calls per week by agent, date: Called_At, series: [Agent], days: 56, bucket: week, span: 3 }
    modals:
      - { id: acknowledge, covers: [R37], kind: status, title: Acknowledge alert, direct: patch, entity: alerts, summary: [Title, Severity], fill: { Status: Acknowledged }, fields: [ { key: Owner, label: Owner, type: select, options_from: team.Name, required: true } ] }
      - { id: assign, covers: [R6, R9], kind: edit, title: Assign counsellor, direct: patch, entity: leads, summary: [Name, Course, Grade], fields: [ { key: Assigned_To, label: Counsellor, type: select, options_from: team.Name, options_where: "Role=Counsellor", required: true } ] }
      - { id: send_link, covers: [R25], kind: status, title: Send payment link, flow: FEE_REMINDER, action: send_link, entity: fees, summary: [Student_Name, Balance_INR, Due_Date], pass: [Fee_ID, Student_Name, Parent_Name, Parent_Phone, Balance_INR, Due_Date, Payment_Link], submit: Send on WhatsApp, success: "Payment link sent to the parent", fields: [] }

  - id: alerts
    covers: [R37]
    route: /alerts
    label: Alerts & escalations
    subtitle: Everything the agents and the rules flagged for a person to act on
    icon: BellRing
    group: Overview
    entity: alerts
    roles: [admin, office, counsellor]
    badge: { entity: alerts, where: "Status=Open" }
    kpis:
      - { metric: alerts_open }
      - { label: Critical, formula: "count where Severity=CRITICAL and Status=Open", icon: AlertOctagon, alert: true }
      - { label: Resolved this week, formula: "count where Status=Resolved and Resolved_At in last 7 days", icon: CheckCircle2 }
    table:
      segments: { column: Status, all: All alerts }
      columns: [ { key: Title, type: text, sub: Detail }, { key: Severity, type: badge }, { key: Kind, type: tag }, { key: Owner, type: owner }, { key: Status, type: badge }, { key: Raised_At, header: Raised, type: date, time: true } ]
      search: [Title, Detail, Owner]
      filters: [Kind, Severity]
      bulk: [acknowledge]
    modals:
      - { id: acknowledge, covers: [R37], kind: status, title: Mark read, direct: patch, summary: [Title, Severity], fill: { Status: Acknowledged }, fields: [ { key: Owner, label: Owner, type: select, options_from: team.Name, required: true } ] }
      - { id: resolve, covers: [R37], kind: status, title: Resolve, direct: patch, summary: [Title], fill: { Status: Resolved, Resolved_At: now }, fields: [ { key: Resolution, label: What was done, type: textarea, rows: 3, required: true } ] }
    actions: { header: [], row: [acknowledge, resolve] }

  - id: leads
    covers: [R1, R3, R5, R6, R7, R8, R9, R39]
    route: /leads
    label: Leads
    subtitle: Every enquiry — called by the AI, graded HOT, WARM or COLD, followed up by a counsellor
    icon: Users
    group: Admissions
    entity: leads
    roles: [admin, counsellor]
    blocks:
      - type: kpis
        kpis:
          - { metric: hot_leads, filter: "Grade=HOT" }
          - { label: WARM, formula: "count where Grade=WARM and Stage not in [Enrolled, Lost]", icon: Thermometer, filter: "Grade=WARM" }
          - { label: COLD, formula: "count where Grade=COLD and Stage not in [Enrolled, Lost]", icon: Snowflake, filter: "Grade=COLD" }
          - { metric: hot_overdue }
      - type: table
        segments: { column: Stage, all: All leads }
        period: { column: Created_At, presets: [today, 7d, 30d, month, all], default: all }
        views: [table, kanban]
        columns: [ { key: Name, type: text, sub: Phone }, { key: Grade, type: badge }, { key: Score, type: number }, { key: Stage, type: badge }, { key: Next_Followup_At, header: Follow-up, type: due }, { key: Assigned_To, header: Counsellor, type: owner }, { key: Course, type: tag }, { key: Source, type: tag, priority: low }, { key: Call_Status, header: AI call, type: badge, priority: low } ]
        search: [Name, Phone, Email, Lead_ID, Course]
        filters: [Course, Source, Grade]
        bulk: [assign]
        kanban: { column: Grade, stages: [Not graded, HOT, WARM, COLD], title: Name, subtitle: Course, meta: [Next_Followup_At], badge: Score, badge_label: Score, avatar: Assigned_To }   # read-only: the grade is the AI call's, a person changes the stage
        drawer: { score: Score, tabs: [ { label: Summary, sections: [ { type: callout, column: AI_Summary, title: AI qualification summary, tone: neutral }, { type: callout, column: Next_Action, title: Next action, tone: info }, { type: fields, columns: [Phone, Email, Course, Source, Notes, Call_Status, Last_Called_At], hide_empty: true } ] }, { label: Transcript, sections: [ { type: callout, column: Transcript, title: AI call transcript, tone: neutral } ] }, { label: Calls, sections: [ { type: related, entity: calls, by: Lead_ID, columns: [Called_At, Status, Outcome, Duration_Sec] } ] } ] }
        empty: { title: No leads yet, reason: "Add an enquiry and the AI calls it within minutes, grades it and tells the counsellor.", action: add_lead }
        actions: { header: [add_lead], row: [call, assign, stage, enrol] }
    modals:
      - id: add_lead
        covers: [R1, R2]
        kind: create
        primary: true
        title: Add lead
        intro: "The AI calls this lead as soon as you save, grades it and writes the summary here."
        flow: ADMISSION_CALL
        action: new_lead
        columns: 2
        submit: Add lead & call
        pending: "Saving and starting the AI call…"
        success: "Lead added — the AI call has started"
        fields:
          - { key: Name, label: Full name, type: text, required: true, placeholder: "e.g. Rahul Sharma" }
          - { key: Phone, label: Phone, type: text, required: true, placeholder: "+91 98765 43210" }
          - { key: Course, label: Course interest, type: select, options_from: courses.Name, options_where: "Active=true", required: true }
          - { key: Source, label: Lead source, type: select, options: [Instagram, WhatsApp, Google Ads, Referral, Website, Walk-in], default: Website, required: true }
          - { key: Email, label: Email, type: text }
          - { key: Assigned_To, label: Counsellor, type: select, options_from: team.Name, options_where: "Role=Counsellor", help: "Leave blank — a HOT lead goes to the counsellor with the fewest open HOT leads" }
          - { key: Notes, label: Notes, type: textarea, rows: 2, placeholder: "Anything the caller should know" }
      - { id: call, covers: [R7], kind: status, title: Call again with AI, flow: ADMISSION_CALL, action: call, summary: [Name, Grade, Last_Called_At], pass: [Lead_ID, Name, Phone, Course, Notes], submit: Start AI call, pending: "Starting the call…", success: "AI call started — the grade updates in a few minutes", fields: [] }
      - { id: assign, covers: [R6], kind: edit, title: Assign counsellor, direct: patch, summary: [Name, Course, Grade], fields: [ { key: Assigned_To, label: Counsellor, type: select, options_from: team.Name, options_where: "Role=Counsellor", required: true }, { key: Next_Followup_At, label: Follow up by, type: date, presets: [tomorrow, +2d, +1w] } ] }
      - { id: stage, covers: [R8], kind: status, title: Change stage, direct: patch, summary: [Name, Stage], fields: [ { key: Stage, label: Stage, type: select, options_status: true, required: true }, { key: Next_Followup_At, label: Next follow-up, type: date, presets: [tomorrow, +2d, +1w], show_when: "Stage not in [Enrolled, Lost]" }, { key: Lost_Reason, label: Reason, type: textarea, rows: 2, required_when: "Stage=Lost", show_when: "Stage=Lost" } ] }
      - id: enrol
        covers: [R10, R11]
        kind: custom
        title: Enrol as student
        flow: STUDENT_MANAGE
        action: enrol
        summary: [Name, Course, Grade]
        pass: [Name, Phone, Course]
        columns: 2
        submit: Enrol & send welcome
        success: "Student enrolled — welcome sent to the parent on WhatsApp"
        fields:
          - { key: Parent_Name, label: Parent name, type: text, required: true }
          - { key: Parent_Phone, label: Parent phone, type: text, required: true }
          - { key: Batch, label: Batch, type: select, options_from: batches.Name, options_where: "Active=true", required: true }
          - { key: Fee_Amount_INR, label: "First instalment (₹)", type: number, required: true }
          - { key: Fee_Due_Date, label: Fee due date, type: date, required: true }

  - id: calls
    covers: [R35, R5, R39]
    route: /calls
    label: AI call log
    subtitle: Every call the five agents made — outcome, sentiment and transcript
    icon: PhoneCall
    group: Admissions
    entity: calls
    roles: [admin, counsellor, mentor]
    read_only: "Calls are written by the agents; a person reads the outcome and the transcript and acts on the lead or student page"
    kpis:
      - { metric: calls_week }
